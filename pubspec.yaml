name: flutter_map_supercluster
description: Very fast Marker clustering for flutter_map. Supports efficient adding/removing of Markers.
version: 5.0.0-dev.2
homepage: https://github.com/rorystephenson/flutter_map_supercluster
topics:
  - flutter-map
  - cluster

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  async: any
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_map: ^8.1.1
  flutter_map_marker_popup:
    git:
      url: https://github.com/joaovvrodrigues/flutter_map_marker_popup.git
      ref: upgrade_flutter_map_v8
  latlong2: ^0.9.1
  provider: ^6.1.4
  supercluster:
    git:
      url: https://github.com/l1qu1d/supercluster_dart.git
      ref: 7572f6a

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter